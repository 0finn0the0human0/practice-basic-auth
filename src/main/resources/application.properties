# == Application ==========================================================================================
spring.application.name=practice-basic-auth

# -- Configure TLS ========================================================================================
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=localhost

server.forward-headers-strategy=framework

# == Actuator Endpoints ===================================================================================
# Admin endpoints scoped to /api/admin/** - secured path in SecurityFilterChain
management.endpoints.web.base-path=/api/admin

# Only necessary endpoints exposed
management.endpoints.web.exposure.include=health,metrics,info,loggers

# Require authorization to see DB/disk/component details
management.endpoint.health.show-details=when-authorized

# == Log Levels ===========================================================================================
# Default level for all packages
logging.level.root=INFO

# Suppress verbose Spring internals
logging.level.org.springframework=WARN
logging.level.org.springframework.security=TRACE

# == Log Output ===========================================================================================
#logging.file.name=/var/log/practice-basic-auth/application.log

# === Log Rotation ========================================================================================
## Roll to a new file after 10MB
#logging.logback.rollingpolicy.max-file-size=10MB
#
## Keep 30 days of rolled files
#logging.logback.rollingpolicy.max-history=30
#
## Hard disk cap - prevents logs from filling the volume
#logging.logback.rollingpolicy.total-size-cap=500MB